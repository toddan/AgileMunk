<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgileMunk - Personal Agile Project Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AgileMunk</h1>
            <p class="subtitle">Personal Agile Project Management Tool</p>
            <nav>
                <button id="homeBtn" class="nav-btn active">Home</button>
                <button id="boardsBtn" class="nav-btn">Boards</button>
            </nav>
        </header>

        <!-- Home Page -->
        <div id="homePage" class="page active">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Boards</h3>
                    <p id="totalBoards" class="stat-number">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Tasks</h3>
                    <p id="totalTasks" class="stat-number">0</p>
                </div>
                <div class="stat-card">
                    <h3>To Do</h3>
                    <p id="todoTasks" class="stat-number">0</p>
                </div>
                <div class="stat-card">
                    <h3>In Progress</h3>
                    <p id="inProgressTasks" class="stat-number">0</p>
                </div>
                <div class="stat-card">
                    <h3>Done</h3>
                    <p id="doneTasks" class="stat-number">0</p>
                </div>
            </div>
        </div>

        <!-- Boards Page -->
        <div id="boardsPage" class="page">
            <div class="page-header">
                <h2>My Boards</h2>
                <button id="createBoardBtn" class="btn btn-primary">Create Board</button>
            </div>
            <div id="boardsList" class="boards-grid"></div>

            <!-- Board Details View -->
            <div id="boardDetails" class="board-details" style="display: none;">
                <div class="board-header">
                    <button id="backToBoards" class="btn btn-secondary">← Back to Boards</button>
                    <h2 id="boardTitle"></h2>
                    <button id="createTaskBtn" class="btn btn-primary">Create Task</button>
                </div>

                <div class="kanban-board">
                    <div class="kanban-column">
                        <h3>To Do</h3>
                        <div id="todoColumn" class="task-list"></div>
                    </div>
                    <div class="kanban-column">
                        <h3>In Progress</h3>
                        <div id="inProgressColumn" class="task-list"></div>
                    </div>
                    <div class="kanban-column">
                        <h3>Done</h3>
                        <div id="doneColumn" class="task-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Create Board Modal -->
        <div id="createBoardModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Create New Board</h3>
                    <button class="close-btn" onclick="closeModal('createBoardModal')">&times;</button>
                </div>
                <form id="createBoardForm">
                    <div class="form-group">
                        <label for="boardName">Board Name *</label>
                        <input type="text" id="boardName" required maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="boardDescription">Description</label>
                        <textarea id="boardDescription" rows="3" maxlength="500"></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeModal('createBoardModal')">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Create Task Modal -->
        <div id="createTaskModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Create New Task</h3>
                    <button class="close-btn" onclick="closeModal('createTaskModal')">&times;</button>
                </div>
                <form id="createTaskForm">
                    <div class="form-group">
                        <label for="taskTitle">Task Title *</label>
                        <input type="text" id="taskTitle" required maxlength="200">
                    </div>
                    <div class="form-group">
                        <label for="taskDescription">Description</label>
                        <textarea id="taskDescription" rows="3" maxlength="1000"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="taskStatus">Status *</label>
                        <select id="taskStatus" required>
                            <option value="TODO">To Do</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="DONE">Done</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskPriority">Priority *</label>
                        <select id="taskPriority" required>
                            <option value="LOW">Low</option>
                            <option value="MEDIUM" selected>Medium</option>
                            <option value="HIGH">High</option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeModal('createTaskModal')">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
